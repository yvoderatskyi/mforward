[workspace]
members = [
    "crates/mforward-config",
    "crates/mforward-core",
    "crates/mforward-kubectl",
    "crates/mforward-gcp-iap",
    "crates/mforward-cli",
]
default-members = ["crates/mforward-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
mforward-config = { path = "crates/mforward-config" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
mforward-core = { path = "crates/mforward-core" }
mforward-kubectl = { path = "crates/mforward-kubectl" }
mforward-gcp-iap = { path = "crates/mforward-gcp-iap" }
anyhow = "1.0.104"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
itertools = "0.15.0"
thiserror = "2.0.21"
tokio = "1.53.2"
tracing = "0.1"
tracing-core = {version = "0.1", features = ["valuable"]}
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
